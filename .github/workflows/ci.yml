name: CI

# build:   runs on every push to main, every pull request, and manual runs.
# release: runs only on main (push or manual run), after build passes.
#          Publishes a new version of the npm package and the Docker image
#          used by action.yml.
#
# Skipping: GitHub skips this workflow when the head commit message contains
# [skip ci] (or [ci skip], [no ci], [skip actions], [actions skip]) anywhere,
# including the commit body.
#
# Versioning: if the version in package.json is higher than every version on
# npm, it is released as-is (bump it manually for minor/major releases).
# Otherwise the patch number of the highest npm version is incremented.
# The bump is committed back to main with [skip ci] and tagged v<version>.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: yaml-resume-builder
  IMAGE_NAME: rubenhak/yaml-resume-builder

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install Yarn
        run: npm install -g yarn@1

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Build and pack
        run: |
          rm -rf build
          npm pack

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version bump + push tag
      id-token: write # npm trusted publishing (OIDC) + provenance
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Determine version
        id: version
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "${PACKAGE_NAME}" versions --json 2>/dev/null || echo '[]')"
          VERSION="$(CURRENT="$CURRENT" PUBLISHED="$PUBLISHED" node -e '
            const parse = v => v.split(".").map(Number);
            const cmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
            let published = JSON.parse(process.env.PUBLISHED);
            if (!Array.isArray(published)) published = [published];
            published = published.filter(v => /^\d+\.\d+\.\d+$/.test(v));
            const current = parse(process.env.CURRENT);
            const max = published.map(parse).sort(cmp).pop();
            if (!max || cmp(current, max) > 0) { console.log(current.join(".")); process.exit(0); }
            console.log(`${max[0]}.${max[1]}.${max[2] + 1}`);
          ')"
          echo "package.json=${CURRENT} -> releasing ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set version in package.json and action.yml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i -E "s|(docker://${IMAGE_NAME}):[^[:space:]]+|\1:${VERSION}|" action.yml
          grep -q "docker://${IMAGE_NAME}:${VERSION}" action.yml

      - name: Install Yarn
        run: npm install -g yarn@1

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Build and pack
        run: |
          rm -rf build
          npm pack
          mv "${PACKAGE_NAME}-${{ steps.version.outputs.version }}.tgz" "${PACKAGE_NAME}.tgz"

      - name: Publish to npm
        run: npm publish "${PACKAGE_NAME}.tgz" --access public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: PRODUCT_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Commit version bump and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json action.yml
          if ! git diff --cached --quiet; then
            git commit -m "Release v${VERSION} [skip ci]"
          fi
          git pull --rebase origin main
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"
